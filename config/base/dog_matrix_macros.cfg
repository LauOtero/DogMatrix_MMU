# Dog Matrix MMU - macros G-code base.
# Incluir desde printer.cfg con:  [include dog_matrix_macros.cfg]

[gcode_macro DM_STATUS]
description: Mostrar estado del MMU Dog Matrix
gcode:
  DM_STATUS

[gcode_macro DM_CHANGE]
description: Cambiar de herramienta
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  DM_CHANGE TOOL={tool}

[gcode_macro DM_LOAD]
description: Cargar filamento del gate activo
gcode:
  DM_LOAD

[gcode_macro DM_UNLOAD]
description: Descargar filamento
gcode:
  DM_UNLOAD

[gcode_macro DM_HOME]
description: Homing del selector
gcode:
  DM_HOME

[gcode_macro DM_RECOVER]
description: Recuperacion tras fallo
gcode:
  DM_RECOVER

[gcode_macro DM_ENCODER]
description: Lectura del encoder
gcode:
  DM_ENCODER

[gcode_macro DM_GATE_MAP]
description: Mostrar/editar mapa de gates
gcode:
  DM_GATE_MAP

[gcode_macro DM_REMAP_TTG]
description: Remapear tool-to-gate
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set gate = params.GATE|default(0)|int %}
  DM_REMAP_TTG TOOL={tool} GATE={gate}

[gcode_macro DM_SPOOLMAN]
description: Consultar/sincronizar Spoolman
gcode:
  DM_SPOOLMAN

[gcode_macro DM_ENDLESS_SPOOL]
description: Estado de grupos EndlessSpool
gcode:
  DM_ENDLESS_SPOOL

[gcode_macro DM_TEST_CONFIG]
description: Validar configuracion en caliente
gcode:
  DM_TEST_CONFIG

# ---------------------------------------------------------------------------
# Hooks de ciclo de vida (nombre _DM_* con alias _MMU_*).
# Sobreescribe cualquiera de estas macros en tu configuracion de usuario para
# inyectar logica propia; el core las invoca automaticamente.
# ---------------------------------------------------------------------------
[gcode_macro _DM_PRE_UNLOAD]
description: Hook previo a la descarga
gcode: {}

[gcode_macro _MMU_PRE_UNLOAD]
description: Alias Happy Hare de _DM_PRE_UNLOAD
gcode:
  _DM_PRE_UNLOAD {rawparams}

[gcode_macro _DM_POST_UNLOAD]
description: Hook posterior a la descarga
gcode: {}

[gcode_macro _MMU_POST_UNLOAD]
description: Alias Happy Hare de _DM_POST_UNLOAD
gcode:
  _DM_POST_UNLOAD {rawparams}

[gcode_macro _DM_PRE_LOAD]
description: Hook previo a la carga
gcode: {}

[gcode_macro _MMU_PRE_LOAD]
description: Alias Happy Hare de _DM_PRE_LOAD
gcode:
  _DM_PRE_LOAD {rawparams}

[gcode_macro _DM_POST_LOAD]
description: Hook posterior a la carga
gcode: {}

[gcode_macro _MMU_POST_LOAD]
description: Alias Happy Hare de _DM_POST_LOAD
gcode:
  _DM_POST_LOAD {rawparams}

[gcode_macro _DM_POST_FORM_TIP]
description: Hook posterior a formacion de punta
gcode: {}

[gcode_macro _MMU_POST_FORM_TIP]
description: Alias Happy Hare de _DM_POST_FORM_TIP
gcode:
  _DM_POST_FORM_TIP {rawparams}

[gcode_macro _DM_ACTION_CHANGED]
description: Hook de cambio de accion de la FSM
gcode: {}

[gcode_macro _MMU_ACTION_CHANGED]
description: Alias Happy Hare de _DM_ACTION_CHANGED
gcode:
  _DM_ACTION_CHANGED {rawparams}

[gcode_macro _DM_PRINT_STATE_CHANGED]
description: Hook de cambio de estado de impresion
gcode: {}

[gcode_macro _MMU_PRINT_STATE_CHANGED]
description: Alias Happy Hare de _DM_PRINT_STATE_CHANGED
gcode:
  _DM_PRINT_STATE_CHANGED {rawparams}

[gcode_macro _DM_GATE_MAP_CHANGED]
description: Hook de cambio del mapa de gates
gcode: {}

[gcode_macro _MMU_GATE_MAP_CHANGED]
description: Alias Happy Hare de _DM_GATE_MAP_CHANGED
gcode:
  _DM_GATE_MAP_CHANGED {rawparams}

[gcode_macro _DM_UNIT_CHANGED]
description: Hook de cambio de unidad multi-unidad
gcode: {}

[gcode_macro _DM_COUNTER_LIMIT]
description: Hook de limite de contador alcanzado
gcode: {}

[gcode_macro _DM_NFC_TAG_UNKNOWN]
description: Hook de tag NFC no reconocido
gcode: {}

# Extensiones de usuario (nombre user_<hook>_extension). El core las invoca
# tras el hook correspondiente cuando existen.
[gcode_macro user_pre_load_extension]
description: Extension de usuario previa a la carga
gcode: {}

[gcode_macro user_post_load_extension]
description: Extension de usuario posterior a la carga
gcode: {}
