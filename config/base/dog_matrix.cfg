# Dog Matrix MMU - configuracion base del modulo.
#
# Usar desde printer.cfg con:
#     [include dog_matrix.cfg]
# Requiere que el instalador haya generado dog_matrix_generated.cfg en el mismo
# directorio (comando:  ./install.sh wizard --profile <perfil> --dest <dir>).

[dog_matrix]
# Perfil de hardware (nombre en profiles/ o ruta a un JSON de perfil).
profile: box_turtle
# profile_path: ~/printer_data/config/dog_matrix_profile.json
profiles_dir:

# Persistencia de estado (snapshot con checksum).
state_store: ~/printer_data/config/dog_matrix_state.json

# Logging estructurado (JSON Lines).
log_level: info
# log_path: ~/printer_data/logs/dog_matrix.jsonl
# evidence_dir: ~/printer_data/evidence

# Capacidades / subsistemas.
enable_flowguard: false
enable_endless_spool: true
enable_spoolman: false
enable_led: true
enable_nfc: false
enable_purge: false

# Recuperacion: si es true, la recuperacion puede actuar sin confirmacion.
auto_recover: false

# --- Sistema multi-unidad (varias MMUs en una impresora) -------------------
# Ver docs/MULTI_UNIT.md y docs/PIN_CONFIGURATION.md. Deshabilitado por defecto.
enable_multi_unit: false
# Bobinas controladas por cada placa/unidad Dog Matrix (gear-per-gate). Cada
# unidad incorpora una placa dedicada de 4 bobinas.
# coils_per_unit: 4
# Descubrimiento USB: directorio de enlaces y patron de nombre.
# usb_scan_dir: /dev/serial/by-id
# usb_scan_pattern: DogMatrix
# enable_usb_scan: true
# Descubrimiento CANbus: UUIDs conocidos (lista separada por comas via JSON).
# enable_can_scan: true
# can_uuids: []
# Intervalo de escaneo continuo (segundos).
# unit_scan_interval_s: 5.0
# Asignacion manual permanente (dispositivo -> numero de bobina). Tiene
# prioridad sobre la asignacion automatica y se persiste.
# unit_assignments: {}
# Almacen persistente de asignaciones (por defecto, junto a state_store).
# units_store: ~/printer_data/config/dog_matrix_units.json

# --- Flujo de carga automatica (pre_gate -> post_gate -> toolhead) ---------
# Ver docs/FILAMENT_FLOW.md. Logica implementada en dog_matrix/autoload.py.
# enable_autoload: false
# Hub/splitter principal: sensor de salida compartido (post_gate), encoder y
# sensor de diametro para control en tiempo real.
# hub_shared_exit: true
# hub_encoder: false
# hub_diameter_sensor: false
# hub_units: 1
# Buffer intermedio de tension/compresion (splitter secundario multi-unidad).
# buffer_tension: false
# buffer_compression: false
# Resiliencia: tiempo maximo de motor encendido antes de FAULT (segundos).
# autoload_pre_gate_timeout_s: 30
# autoload_bowden_timeout_s: 60

# --- Ventilador de la MMU (control con histeresis, dirigido por reactor) ---
# enable_fan_control: false
# fan_pin: mmu_fan          # objeto [fan_generic]/[fan] a controlar
# fan_on_temp: 45
# fan_off_temp: 40
# fan_polling_s: 1.0

[include dog_matrix_generated.cfg]
