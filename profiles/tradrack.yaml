# Dog Matrix MMU - Perfil Tradrack
# Selector rotativo, 8 gates.
schema_version: 1
profile_id: dog_matrix.tradrack.v1
display_name: Tradrack
topology:
  type: selector
  gates: 8
  units: 1
  selector_type: rotary
capabilities:
  selector: true
  encoder: true
  gate_sensors: true
  toolhead_sensor: true
  sync_feedback: false
  endless_spool: true
  spoolman: true
  nfc: false
  led: true
  cutter: false
  servo: true
  espooler: false
limits:
  max_load_speed_mm_s: 90
  max_unload_speed_mm_s: 100
  max_distance_mm: 1400
  max_accel_mm_s2: 2000
  max_jerk_mm_s3: 10000
  sensor_timeout_ms: 500
  encoder_error_mm: 5
  bowden_length_mm: 650
  toolhead_distance_mm: 80
hardware:
  mcu:
    - name: mmu_main
      transport: usb
      serial_by_id: "/dev/serial/by-id/usb-DogMatrix_MMU-main-if00"
  led:
    type: neopixel
    count: 8
    pin: main:PA0
  nfc:
    type: none
    bus: none
