# Dog Matrix MMU - Perfil EMU (modular)
# Varias unidades conectables, 8 gates en 2 unidades de 4.
schema_version: 1
profile_id: dog_matrix.emu.v1
display_name: EMU Modular
topology:
  type: modular
  gates: 8
  units: 2
  selector_type: virtual
capabilities:
  selector: false
  encoder: true
  gate_sensors: true
  toolhead_sensor: true
  sync_feedback: false
  endless_spool: true
  spoolman: true
  nfc: true
  led: true
  cutter: false
  servo: false
  espooler: true
limits:
  max_load_speed_mm_s: 75
  max_unload_speed_mm_s: 90
  max_distance_mm: 1300
  max_accel_mm_s2: 1800
  max_jerk_mm_s3: 9000
  sensor_timeout_ms: 500
  encoder_error_mm: 5
  bowden_length_mm: 550
  toolhead_distance_mm: 75
hardware:
  mcu:
    - name: mmu_main
      transport: usb
      serial_by_id: "/dev/serial/by-id/usb-DogMatrix_MMU-main-if00"
    - name: mmu_gates
      transport: usb
      serial_by_id: "/dev/serial/by-id/usb-DogMatrix_MMU-gates-if00"
  led:
    type: neopixel
    count: 8
    pin: main:PA0
  nfc:
    type: pn532
    bus: i2c
    address: "0x24"
