# Dog Matrix MMU - Plantilla de perfil personalizado.
# Copiar a profiles/<mi_perfil>.yaml y ajustar. Validar contra profiles/schema.json.
schema_version: 1
profile_id: dog_matrix.custom.v1
display_name: Custom MMU
topology:
  type: gear_per_gate        # gear_per_gate | selector | modular | hybrid | virtual
  gates: 4                   # 1..64
  units: 1                   # 1..16
  selector_type: virtual     # solo si type: selector  -> linear | rotary | virtual
  gate_pitch_mm: 0
capabilities:
  selector: false
  encoder: true
  gate_sensors: true
  toolhead_sensor: true
  sync_feedback: false
  endless_spool: false
  spoolman: false
  nfc: false
  led: false
  cutter: false
  servo: false
  espooler: false
limits:
  max_load_speed_mm_s: 80
  max_unload_speed_mm_s: 100
  max_distance_mm: 1500
  max_accel_mm_s2: 2000
  max_jerk_mm_s3: 10000
  sensor_timeout_ms: 500
  encoder_error_mm: 5
  bowden_length_mm: 600
  toolhead_distance_mm: 80
hardware:
  mcu:
    - name: mmu_main
      transport: usb
      serial_by_id: "/dev/serial/by-id/usb-CHANGE_ME"
  led:
    type: none
    count: 0
    pin: main:PA0
  nfc:
    type: none
    bus: none
