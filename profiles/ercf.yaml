# Dog Matrix MMU - Perfil ERCF 2.0
# Topología con selector lineal, 6 gates.
schema_version: 1
profile_id: dog_matrix.ercf.v1
display_name: ERCF 2.0
topology:
  type: selector
  gates: 6
  units: 1
  selector_type: linear
  gate_pitch_mm: 22.5
capabilities:
  selector: true
  encoder: true
  gate_sensors: true
  toolhead_sensor: true
  sync_feedback: true
  endless_spool: true
  spoolman: true
  nfc: false
  led: true
  cutter: true
  servo: true
  espooler: false
limits:
  max_load_speed_mm_s: 70
  max_unload_speed_mm_s: 80
  max_distance_mm: 1200
  max_accel_mm_s2: 1500
  max_jerk_mm_s3: 8000
  sensor_timeout_ms: 500
  encoder_error_mm: 5
  bowden_length_mm: 500
  toolhead_distance_mm: 70
hardware:
  mcu:
    - name: mmu_main
      transport: usb
      serial_by_id: "/dev/serial/by-id/usb-DogMatrix_MMU-main-if00"
  led:
    type: neopixel
    count: 6
    pin: main:PA0
  nfc:
    type: none
    bus: none
