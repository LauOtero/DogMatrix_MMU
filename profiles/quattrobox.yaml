# Dog Matrix MMU - Perfil QuattroBox
# gear-per-gate, 4 gates.
schema_version: 1
profile_id: dog_matrix.quattrobox.v1
display_name: QuattroBox
topology:
  type: gear_per_gate
  gates: 4
  units: 1
capabilities:
  selector: false
  encoder: true
  gate_sensors: true
  toolhead_sensor: false
  sync_feedback: false
  endless_spool: false
  spoolman: true
  nfc: false
  led: true
  cutter: false
  servo: false
  espooler: false
limits:
  max_load_speed_mm_s: 70
  max_unload_speed_mm_s: 85
  max_distance_mm: 1100
  max_accel_mm_s2: 1500
  max_jerk_mm_s3: 8000
  sensor_timeout_ms: 500
  encoder_error_mm: 5
  bowden_length_mm: 450
  toolhead_distance_mm: 70
hardware:
  mcu:
    - name: mmu_main
      transport: usb
      serial_by_id: "/dev/serial/by-id/usb-DogMatrix_MMU-main-if00"
  led:
    type: neopixel
    count: 4
    pin: main:PA0
  nfc:
    type: none
    bus: none
