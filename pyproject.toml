[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-matrix-mmu"
version = "0.1.0"
description = "Dog Matrix MMU - Driver MMU/AFC industrial para Klipper (clean-room)"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "Dog Matrix Project" }]
keywords = ["klipper", "moonraker", "mmu", "afc", "3d-printing", "multi-material"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "isort>=5.12", "flake8>=6.0"]

[project.scripts]
dog-matrix = "installer.cli:main"

[tool.setuptools]
packages = ["installer"]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.package-data]
installer = ["templates/*.tmpl"]

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
